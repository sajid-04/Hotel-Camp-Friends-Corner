{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Edit Profile | Hotel Camp Friends Corner
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f6f8;

            color: #222;

            min-height: 100vh;

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: #111;

            color: white;

            padding: 18px 20px;

        }


        .header-inner {

            max-width: 1100px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .brand-logo {

            width: 55px;

            height: 55px;

            min-width: 55px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

        }


        .brand-name {

            font-size: 21px;

            font-weight: 700;

            white-space: nowrap;

        }


        .back-menu {

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            padding: 10px 15px;

            border: 1px solid #555;

            border-radius: 8px;

            white-space: nowrap;

        }


        .back-menu:hover {

            background: #222;

        }


        /* =========================
           MAIN
        ========================= */

        .container {

            max-width: 700px;

            margin: 45px auto;

            padding: 0 20px;

        }


        .page-title {

            text-align: center;

            margin-bottom: 10px;

            font-size: 34px;

        }


        .page-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

            font-size: 15px;

        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {

            background: white;

            border-radius: 16px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.08);

            padding: 30px;

        }


        .form-group {

            margin-bottom: 22px;

        }


        label {

            display: block;

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 8px;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #d5d5d5;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #123047;

        }


        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 10px;

        }


        .save-button {

            flex: 1;

            border: none;

            background: #123047;

            color: white;

            padding: 14px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

        }


        .save-button:hover {

            background: #0d2537;

        }


        .cancel-button {

            flex: 1;

            text-align: center;

            text-decoration: none;

            background: #eeeeee;

            color: #333;

            padding: 14px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 700;

        }


        .cancel-button:hover {

            background: #dddddd;

        }


        /* =========================
           MESSAGES
        ========================= */

        .messages {

            margin-bottom: 20px;

        }


        .message {

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 10px;

            background: #ffe5e5;

            color: #a00000;

            font-size: 14px;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            color: #888;

            font-size: 13px;

            padding:
                25px
                15px
                35px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {

                padding:
                    14px
                    15px;

            }


            .header-inner {

                gap: 10px;

            }


            .brand {

                gap: 10px;

            }


            .brand-logo {

                width: 55px;

                height: 55px;

                min-width: 55px;

            }


            .brand-name {

                font-size: 17px;

            }


            .back-menu {

                font-size: 13px;

                padding:
                    8px
                    10px;

            }


            .container {

                margin:
                    30px
                    auto;

                padding:
                    0
                    14px;

            }


            .page-title {

                font-size: 28px;

            }


            .page-subtitle {

                font-size: 14px;

                margin-bottom: 25px;

            }


            .form-card {

                padding: 22px 18px;

            }


            .buttons {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="header-inner">


            <div class="brand">

                <img
                    src="{% static 'customer/friends-corner-logo.png' %}"
                    class="brand-logo"
                    alt="Hotel Camp Friends Corner Logo">


                <div class="brand-name">
                    Hotel Camp Friends Corner
                </div>

            </div>


            <a
                href="{% url 'menu' %}"
                class="back-menu">

                🍽️ Menu

            </a>


        </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <h1 class="page-title">
            Edit Profile
        </h1>


        <p class="page-subtitle">
            Update your personal information
        </p>


        <!-- MESSAGES -->

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- FORM -->

        <div class="form-card">


            <form method="POST">

                {% csrf_token %}


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        value="{{ request.user.first_name }}"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ request.user.email }}"
                        placeholder="Enter your email address"
                        required>

                </div>


                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        value="{{ request.user.last_name }}"
                        placeholder="Enter your 10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        required>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">


                    <button
                        type="submit"
                        class="save-button">

                        Save Changes

                    </button>


                    <a
                        href="{% url 'account' %}"
                        class="cancel-button">

                        Cancel

                    </a>


                </div>


            </form>


        </div>


    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        © 2026 Hotel Camp Friends Corner

    </footer>


</body>

</html>
