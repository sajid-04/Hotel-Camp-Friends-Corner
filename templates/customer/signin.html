<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - Hotel Camp Friends Corner</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        .signin-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px 30px;

            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }


        .logo-title {
            text-align: center;

            margin-bottom: 25px;
        }


        .logo-title h1 {
            margin: 0;

            font-size: 27px;

            line-height: 1.25;

            color: #8b0000;
        }


        .logo-title p {
            margin-top: 8px;

            color: #666;

            font-size: 14px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

            font-size: 14px;
        }


        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }


        input:focus {
            border-color: #8b0000;
        }


        .password-wrapper {
            position: relative;
        }


        .password-wrapper input {
            padding-right: 75px;
        }


        .show-password {
            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            width: auto;

            padding: 5px;

            margin: 0;

            background: transparent;

            color: #8b0000;

            border: none;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;
        }


        .show-password:hover {
            background: transparent;

            color: #650000;
        }


        .messages {
            margin-bottom: 20px;
        }


        .message {
            padding: 10px;

            border-radius: 6px;

            background: #ffe6e6;

            color: #8b0000;

            font-size: 14px;

            margin-bottom: 8px;

            text-align: center;
        }


        .signin-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #8b0000;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .signin-button:hover {
            background: #650000;
        }


        .signup-link {
            text-align: center;

            margin-top: 20px;

            font-size: 14px;

            color: #555;
        }


        .signup-link a {
            color: #8b0000;

            text-decoration: none;

            font-weight: bold;
        }


        .signup-link a:hover {
            text-decoration: underline;
        }


        .back-home {
            text-align: center;

            margin-top: 15px;

            padding-top: 15px;

            border-top: 1px solid #eee;
        }


        .back-home a {
            color: #8b0000;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }


        .back-home a:hover {
            text-decoration: underline;
        }


        @media (max-width: 480px) {

            body {
                padding: 12px;
            }


            .signin-container {
                padding: 28px 20px;

                border-radius: 12px;
            }


            .logo-title h1 {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>


<div class="signin-container">


    <div class="logo-title">

        <h1>
            Hotel Camp Friends Corner
        </h1>

        <p>
            Sign in to your account
        </p>

    </div>


    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()"
            >
                Show
            </button>

        </div>


        <button
            type="submit"
            class="signin-button"
        >
            Sign In
        </button>


    </form>


    <div class="signup-link">

        Don't have an account?

        <a href="{% url 'signup' %}">
            Create Account
        </a>

    </div>


    <div class="back-home">

        <a href="{% url 'home' %}">
            ← Back to Home
        </a>

    </div>


</div>


<script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        const button =
            document.querySelector(".show-password");


        if (password.type === "password") {

            password.type = "text";

            button.textContent = "Hide";

        } else {

            password.type = "password";

            button.textContent = "Show";

        }

    }

</script>


</body>

</html>
