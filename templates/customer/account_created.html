<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Account Created - Hotel Camp Friends Corner
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }


        .success-box {
            width: 90%;

            max-width: 450px;

            background: white;

            padding: 40px 30px;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }


        .check {
            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #8b0000;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 38px;
        }


        h1 {
            color: #8b0000;

            font-size: 27px;

            margin-bottom: 12px;
        }


        p {
            color: #555;

            line-height: 1.6;

            font-size: 15px;
        }


        .thank-you {
            font-weight: bold;

            color: #333;
        }


        .login-button {
            display: inline-block;

            margin-top: 20px;

            padding: 13px 35px;

            background: #8b0000;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-weight: bold;
        }


        .login-button:hover {
            background: #650000;
        }

    </style>

</head>


<body>


<div class="success-box">


    <div class="check">
        ✓
    </div>


    <h1>
        Account Created Successfully!
    </h1>


    <p>
        Your Hotel Camp Friends Corner account has
        been created successfully.
    </p>


    <p class="thank-you">
        Thank you for joining us!
    </p>


    <p>
        Please login to continue.
    </p>


    <a
        href="{% url 'signin' %}"
        class="login-button"
    >
        Login to Your Account
    </a>


</div>


</body>

</html>
