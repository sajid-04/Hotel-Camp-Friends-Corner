{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | Hotel Camp Friends Corner</title>

    <link rel="stylesheet" href="{% static 'customer/style.css?v=35' %}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f6f3ea;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }

        .cart-header {
            background: #123047;
            color: white;
            padding: 18px 20px;
        }

        .cart-header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .cart-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .cart-brand-logo {
            width: 58px;
            height: 58px;
            min-width: 58px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .cart-brand-name {
            font-size: 25px;
            font-weight: 700;
            white-space: nowrap;
        }

        .back-menu {
            color: white;
            text-decoration: none;
            font-weight: 700;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            white-space: nowrap;
        }

        .cart-page {
            max-width: 1050px;
            margin: 35px auto;
            padding: 0 20px 40px;
        }

        .cart-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .cart-title h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .cart-title p {
            margin: 0;
            color: #777;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            gap: 24px;
            align-items: start;
        }

        .cart-card,
        .summary-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .cart-card {
            padding: 8px 20px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto auto;
            align-items: center;
            gap: 16px;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.35;
        }

        .item-price {
            margin-top: 5px;
            color: #777;
            font-size: 14px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 4px;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: #123047;
            color: white;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        .quantity {
            min-width: 28px;
            text-align: center;
            font-weight: 700;
        }

        .item-total {
            min-width: 85px;
            text-align: right;
            font-weight: 700;
        }

        .remove-btn {
            border: none;
            background: none;
            color: #b3261e;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
        }

        .summary-card {
            padding: 24px;
            position: sticky;
            top: 20px;
            border: 1px solid #ece8de;
            box-shadow: 0 12px 32px rgba(18, 48, 71, 0.1);
        }

        .summary-card h2 {
            margin: 0 0 6px;
            color: #123047;
            font-size: 22px;
        }

        .summary-intro {
            margin: 0 0 22px;
            color: #6b777d;
            font-size: 14px;
            line-height: 1.4;
        }

        .fulfillment-options {
            min-width: 0;
            border: 0;
            margin: 0 0 22px;
            padding: 0;
        }

        .fulfillment-options legend {
            padding: 0;
            margin-bottom: 10px;
            color: #344955;
            font-size: 13px;
            font-weight: 700;
        }

        .fulfillment-options label {
            display: block;
            position: relative;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .fulfillment-options label:last-child {
            margin-bottom: 0;
        }

        .fulfillment-options input {
            position: absolute;
            opacity: 0;
        }

        .fulfillment-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 68px;
            padding: 11px 12px;
            border: 1px solid #dfe5e7;
            border-radius: 11px;
            background: #fff;
            transition: border-color .2s, background .2s, box-shadow .2s;
        }

        .fulfillment-card:hover {
            border-color: #9eb4bf;
        }

        .fulfillment-options input:checked + .fulfillment-card {
            border-color: #123047;
            background: #f0f6f7;
            box-shadow: inset 0 0 0 1px #123047;
        }

        .fulfillment-options input:focus-visible + .fulfillment-card {
            outline: 3px solid #d5a649;
            outline-offset: 2px;
        }

        .fulfillment-icon {
            display: grid;
            place-items: center;
            flex: 0 0 40px;
            height: 40px;
            border-radius: 10px;
            background: #f7f1e4;
            font-size: 20px;
        }

        .fulfillment-text {
            flex: 1;
            min-width: 0;
        }

        .fulfillment-text strong,
        .fulfillment-text small {
            display: block;
        }

        .fulfillment-text strong {
            color: #123047;
            font-size: 15px;
        }

        .fulfillment-text small {
            margin-top: 3px;
            color: #65747a;
            font-size: 12px;
            line-height: 1.35;
        }

        .fulfillment-check {
            flex: 0 0 19px;
            width: 19px;
            height: 19px;
            border: 2px solid #bbc8cc;
            border-radius: 50%;
            background: white;
        }

        .fulfillment-options input:checked + .fulfillment-card .fulfillment-check {
            border: 5px solid #123047;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 14px;
            color: #657178;
            font-size: 14px;
        }

        .summary-row[hidden] {
            display: none;
        }

        .summary-row strong,
        .summary-row span:last-child {
            color: #263d4a;
            text-align: right;
        }

        .summary-total {
            border-top: 1px solid #e6eaeb;
            margin-top: 18px;
            padding-top: 20px;
            color: #123047;
            font-size: 21px;
            font-weight: 700;
        }

        .checkout-btn,
        .continue-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            padding: 14px;
            margin-top: 13px;
            font-size: 16px;
            font-weight: 700;
            transition: background .2s, border-color .2s;
        }

        .checkout-btn {
            border: none;
            background: #123047;
            color: white;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #1b4963;
        }

        .continue-btn {
            border: 1px solid #dce3e5;
            background: white;
            color: #123047;
        }

        .continue-btn:hover {
            background: #f5f8f8;
            border-color: #9eb4bf;
        }

        .checkout-btn:focus-visible,
        .continue-btn:focus-visible {
            outline: 3px solid #d5a649;
            outline-offset: 2px;
        }

        .empty-cart {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            padding: 55px 25px;
        }

        .empty-cart-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            margin: 0 0 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .empty-cart a {
            display: inline-block;
            background: #123047;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
        }

        .cart-message {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%) translateY(20px);
            background: #123047;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            z-index: 9999;
        }

        .cart-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .cart-notices {
            margin-bottom: 18px;
            padding: 12px;
            border: 1px solid #e0aaaa;
            border-radius: 8px;
            background: #fff1f1;
            color: #a00000;
        }

        @media (max-width: 750px) {

            .cart-header {
                padding: 14px 15px;
            }

            .cart-brand {
                gap: 10px;
            }

            .cart-brand-logo {
                width: 52px;
                height: 52px;
                min-width: 52px;
            }

            .cart-brand-name {
                font-size: 18px;
            }

            .back-menu {
                font-size: 13px;
                padding: 8px 10px;
            }

            .cart-page {
                margin-top: 25px;
                padding: 0 14px 30px;
            }

            .cart-title h1 {
                font-size: 28px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary-card {
                position: static;
            }

            .cart-card {
                padding: 5px 14px;
            }

            .cart-item {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 10px 12px;
                padding: 17px 0;
            }

            .item-name {
                font-size: 16px;
            }

            .quantity-box {
                grid-column: 1;
                grid-row: 2;
                justify-self: start;
            }

            .item-total {
                grid-column: 2;
                grid-row: 2;
                align-self: center;
                min-width: auto;
            }

            .remove-btn {
                grid-column: 2;
                grid-row: 1;
                justify-self: end;
            }
        }
    </style>
</head>

<body>

<header class="cart-header">
    <div class="cart-header-inner">

        <div class="cart-brand">
            <img
                src="{% static 'customer/friends-corner-logo.png' %}"
                class="cart-brand-logo"
                alt="Hotel Camp Friends Corner Logo">

            <div class="cart-brand-name">
                Hotel Camp Friends Corner
            </div>
        </div>

        <a href="{% url 'menu' %}" class="back-menu">
            🍽️ Menu
        </a>

    </div>
</header>


<main class="cart-page">

    {% if messages %}
    <div class="cart-notices" role="alert">
        {% for message in messages %}
        <div>{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="cart-title">
        <h1>🛒 Your Cart</h1>
        <p>Review your selected food before checkout.</p>
    </div>

    <div id="catalogNotice" class="cart-notices" role="status" hidden></div>
    <div id="cartContent"></div>

</main>


<div id="cartMessage" class="cart-message"></div>


{{ menu_prices|json_script:"menu-prices" }}
<script src="{% static 'customer/cart-prices.js' %}?v=1"></script>
<script>

const cartKey = "friendsCornerCart";
const fulfillmentKey = "friendsCornerFulfillment";
let fulfillment = sessionStorage.getItem(fulfillmentKey) === "takeaway" ? "takeaway" : "delivery";
const menuPrices = JSON.parse(document.getElementById("menu-prices").textContent);
let cartPricesUpdated = false;


function getCart() {

    try {
        return JSON.parse(
            localStorage.getItem(cartKey)
        ) || [];
    } catch (error) {
        return [];
    }
}


function saveCart(cart) {

    localStorage.setItem(
        cartKey,
        JSON.stringify(cart)
    );
}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text || "";

    return div.innerHTML;
}


function showMessage(message) {

    const box =
        document.getElementById("cartMessage");

    box.textContent = "✓ " + message;

    box.classList.add("show");

    setTimeout(function() {
        box.classList.remove("show");
    }, 1500);
}


function increaseQuantity(index) {

    const cart = getCart();

    if (!cart[index]) {
        return;
    }

    cart[index].quantity =
        (Number(cart[index].quantity) || 1) + 1;

    saveCart(cart);

    renderCart();
}


function decreaseQuantity(index) {

    const cart = getCart();

    if (!cart[index]) {
        return;
    }

    const quantity =
        Number(cart[index].quantity) || 1;

    if (quantity > 1) {

        cart[index].quantity =
            quantity - 1;

    } else {

        cart.splice(index, 1);
    }

    saveCart(cart);

    renderCart();
}


function removeItem(index) {

    const cart = getCart();

    if (!cart[index]) {
        return;
    }

    const itemName = cart[index].name;

    cart.splice(index, 1);

    saveCart(cart);

    showMessage(itemName + " removed");

    renderCart();
}


function renderCart() {

    const cart = getCart();
    const priceStatus = refreshCartPrices(cart, menuPrices);
    if (priceStatus.updated) {
        cartPricesUpdated = true;
        saveCart(cart);
    }
    const notice = document.getElementById("catalogNotice");
    notice.hidden = !cart.length || (!priceStatus.unavailable && !cartPricesUpdated);
    notice.textContent = !menuPrices
        ? "The menu is temporarily unavailable. Please contact the restaurant."
        : priceStatus.unavailable
        ? "Some items are unavailable. Remove them before proceeding to checkout."
        : "Menu prices have changed. Please review the updated cart.";

    const content =
        document.getElementById("cartContent");


    if (cart.length === 0) {

        content.innerHTML = `
            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🛒
                </div>

                <h2>Your cart is empty</h2>

                <p>
                    Add delicious food from our menu
                    to start your order.
                </p>

                <a href="{% url 'menu' %}">
                    🍽️ Browse Menu
                </a>

            </div>
        `;

        return;
    }


    let subtotal = 0;
    let totalItems = 0;


    let itemsHTML = "";


    cart.forEach(function(item, index) {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 1;

        const itemTotal =
            price * quantity;


        subtotal += itemTotal;

        totalItems += quantity;


        itemsHTML += `

            <div class="cart-item">

                <div>
                    <div class="item-name">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="item-price">
                        ₹${price.toFixed(2)} each
                    </div>
                </div>


                <div class="quantity-box">

                    <button
                        type="button"
                        class="quantity-btn"
                        onclick="decreaseQuantity(${index})">
                        −
                    </button>

                    <span class="quantity">
                        ${quantity}
                    </span>

                    <button
                        type="button"
                        class="quantity-btn"
                        onclick="increaseQuantity(${index})">
                        +
                    </button>

                </div>


                <div class="item-total">
                    ₹${itemTotal.toFixed(2)}
                </div>


                <button
                    type="button"
                    class="remove-btn"
                    onclick="removeItem(${index})">
                    Remove
                </button>

            </div>

        `;
    });


    content.innerHTML = `

        <div class="cart-layout">

            <div class="cart-card">
                ${itemsHTML}
            </div>


            <div class="summary-card">

                <h2>Order Summary</h2>
                <p class="summary-intro">Almost there! Choose how you'd like your order.</p>

                <fieldset class="fulfillment-options">
                    <legend>Choose order type</legend>
                    <label>
                        <input type="radio" name="fulfillment" value="takeaway"
                            ${fulfillment === "takeaway" ? "checked" : ""}
                            onchange="selectFulfillment(this.value)">
                        <span class="fulfillment-card">
                            <span class="fulfillment-icon" aria-hidden="true">🛍️</span>
                            <span class="fulfillment-text">
                                <strong>Takeaway</strong>
                                <small>Collect from the restaurant</small>
                            </span>
                            <span class="fulfillment-check" aria-hidden="true"></span>
                        </span>
                    </label>
                    <label>
                        <input type="radio" name="fulfillment" value="delivery"
                            ${fulfillment === "delivery" ? "checked" : ""}
                            onchange="selectFulfillment(this.value)">
                        <span class="fulfillment-card">
                            <span class="fulfillment-icon" aria-hidden="true">🚚</span>
                            <span class="fulfillment-text">
                                <strong>Delivery</strong>
                                <small>Delivered to your doorstep</small>
                            </span>
                            <span class="fulfillment-check" aria-hidden="true"></span>
                        </span>
                    </label>
                </fieldset>

                <div class="summary-row">
                    <span>Items</span>
                    <strong>${totalItems}</strong>
                </div>


                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong>₹${subtotal.toFixed(2)}</strong>
                </div>


                <div class="summary-row" id="cartDeliveryRow" ${fulfillment === "takeaway" ? "hidden" : ""}>
                    <span>Delivery</span>
                    <span>Calculated at checkout</span>
                </div>


                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span>₹${subtotal.toFixed(2)}</span>
                </div>


                <button
                    type="button"
                    class="checkout-btn"
                    ${priceStatus.unavailable ? "disabled" : ""}
                    onclick="checkoutNext()">
                    Proceed to Checkout
                </button>


                <a
                    href="{% url 'menu' %}"
                    class="continue-btn">
                    ← Continue Shopping
                </a>

            </div>

        </div>

    `;
}


function selectFulfillment(value) {
    fulfillment = value;
    sessionStorage.setItem(fulfillmentKey, value);
    document.getElementById("cartDeliveryRow").hidden = value === "takeaway";
}


function checkoutNext() {
    const cart = getCart();

    if (refreshCartPrices(cart, menuPrices).unavailable) {
        renderCart();
        return;
    }
    if (cart.length === 0) {
        showMessage("Your cart is empty.");
        return;
    }

    window.location.href = "{% url 'checkout' %}?fulfillment=" + encodeURIComponent(fulfillment);
}


renderCart();

</script>

</body>
</html>
